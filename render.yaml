services:
  - type: web
    name: demo
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: DATABASE_URL
        fromDatabase:
          name: betadrix-db
          property: connectionString

databases:
  - name: betadrix-db
    plan: free
    databaseName: betadrix
    user: betadrix_user
